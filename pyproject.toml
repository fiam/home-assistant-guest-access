[project]
name = "home-assistant-guest-access"
version = "0.5.0"
requires-python = ">=3.14.2"
description = "Password-protected, time-bound guest links for selected Home Assistant actions"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]
