name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (HA ${{ matrix.ha }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ha: ["2026.10.4", "2026.11.0b2"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build test environment
        run: docker build --build-arg HA_VERSION=${{ matrix.ha }} -t guest-access-test -f tests/Dockerfile .
      - name: Test against Home Assistant
        run: docker run --rm --network none -v "$PWD:/work:ro" guest-access-test -q

  quality:
    name: Lint, frontend, and package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install ruff==0.17.3
      - run: ruff check . && ruff format --check .
      - run: node --test tests/test_frontend.mjs
      - run: python scripts/package.py
      - name: Scan committed history for secrets
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1 git --redact /repo

  hassfest:
    name: Home Assistant validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361

  hacs:
    name: HACS and Marketplace validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          comment: "false"
